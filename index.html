<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תרגול מתמטיקה – כיתה ז</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#3b6cf6;--acl:#e6edff;--ok:#16a34a;--okl:#dcfce7;--bad:#dc2626;--badl:#fee2e2;--bd:#d9dde6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1e222b;--tx:#eceef3;--mut:#9aa3b2;--ac:#7c9cff;--acl:#26324f;--ok:#4ade80;--okl:#17331f;--bad:#f87171;--badl:#3b1d1d;--bd:#363c4a}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1e222b;--tx:#eceef3;--mut:#9aa3b2;--ac:#7c9cff;--acl:#26324f;--ok:#4ade80;--okl:#17331f;--bad:#f87171;--badl:#3b1d1d;--bd:#363c4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1;min-width:70px;padding:9px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
#qt{font-size:19px;margin:0 0 10px}
.svg{display:block;margin:6px auto;max-width:100%;height:auto;direction:ltr}
.sv svg{width:264px}
.gl{stroke:var(--bd);stroke-width:1}.ax{stroke:var(--tx);stroke-width:1.6}
.svg text{fill:var(--tx)}.pt{fill:var(--ac)}.cp{fill:var(--bad)}
.sh{fill:var(--acl);stroke:var(--ac);stroke-width:2}.ln{stroke:var(--ac);stroke-width:2.5}.ar{fill:none;stroke:var(--bad);stroke-width:2}
.ans{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
input{width:90px;font-size:20px;padding:8px;text-align:center;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus{outline:none;border-color:var(--ac)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{padding:12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:17px;cursor:pointer}
.opt:disabled{cursor:default}.opt.good{border-color:var(--ok);background:var(--okl)}.opt.wrong{border-color:var(--bad);background:var(--badl)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:10px;border:none;font-size:16px;cursor:pointer;background:var(--ac);color:#fff}
.btn.sec{background:var(--acl);color:var(--ac)}
.fb{margin-top:12px;padding:12px;border-radius:10px}
.fb.ok{background:var(--okl)}.fb.no{background:var(--badl)}.fb.hint{background:var(--acl)}
details{font-size:14.5px;color:var(--mut)}summary{cursor:pointer;color:var(--ac);font-size:15px}
.big{font-size:42px;text-align:center;margin:6px 0}
[hidden]{display:none!important}
.ex{padding:14px}.qh{display:flex;gap:10px;align-items:flex-start}.nb{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}.qt{font-size:18px}.sm{padding:6px 12px;font-size:14px}h2{font-size:19px;margin:22px 0 10px}.opt.sel{border-color:var(--ac);background:var(--acl)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.2;font-size:.95em}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.fr>span:last-child{padding:0 4px}
</style>
</head>
<body>
<div class="w">
<h1>📐 תרגול מתמטיקה – כיתה ז</h1>
<div class="tabs" id="tabs"></div>
<div class="card"><details id="tip"><summary>תזכורת: מה חשוב לזכור?</summary><div id="tipb"></div></details></div>
<div id="main"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[r(0,a.length-1)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const nz=(a,b)=>{let v;do v=r(a,b);while(!v);return v};
const L=s=>`<span dir="ltr">${s}</span>`;
const P=(x,y)=>L(`(${x}, ${y})`);
const RAD=Math.PI/180;

function grid(pts,cp,ex){
 let s='<svg viewBox="0 0 264 264" class="svg" id="g">';
 for(let i=-5;i<=5;i++){const p=132+i*24;
  s+=`<line class="gl" x1="${p}" y1="12" x2="${p}" y2="252"/><line class="gl" x1="12" y1="${p}" x2="252" y2="${p}"/>`;
  if(i)s+=`<text x="${p}" y="145" font-size="9" text-anchor="middle">${i}</text><text x="127" y="${135-i*24}" font-size="9" text-anchor="end">${i}</text>`;}
 s+=`<line class="ax" x1="8" y1="132" x2="256" y2="132"/><line class="ax" x1="132" y1="8" x2="132" y2="256"/><text x="256" y="124" font-size="13" text-anchor="end">x</text><text x="140" y="16" font-size="13">y</text>`;
 s+=ex||"";
 (pts||[]).forEach(p=>{const X=132+p[0]*24,Y=132-p[1]*24;s+=`<circle class="pt" cx="${X}" cy="${Y}" r="5"/>`+(p[2]?`<text x="${X+7}" y="${Y-7}" font-size="13" font-weight="700">${p[2]}</text>`:'')});
 if(cp)s+=`<circle class="cp" cx="${132+cp[0]*24}" cy="${132-cp[1]*24}" r="6"/>`;
 return s+'</svg>';
}
const asvg=i=>`<svg viewBox="0 0 260 180" class="svg" width="280">${i}</svg>`;


const COORD=[
()=>{const x=r(-5,5),y=r(-5,5);return{type:'xy',t:'מהם שיעורי הנקודה A?',pts:[[x,y,'A']],ans:[x,y],hint:'קודם קוראים את x (ימינה/שמאלה), אחר כך את y (למעלה/למטה).',why:`הנקודה A היא ${P(x,y)}.`}},
()=>{const x=r(-5,5),y=r(-5,5);return{type:'click',t:`לחצו על הרשת כדי לסמן את הנקודה ${P(x,y)}`,pts:[],ans:[x,y],hint:`מתחילים בראשית, זזים ${Math.abs(x)} ${x>=0?'ימינה':'שמאלה'} ואז ${Math.abs(y)} ${y>=0?'למעלה':'למטה'}.`,why:`הנקודה ${P(x,y)} נמצאת ${Math.abs(x)} ${x>=0?'ימינה':'שמאלה'} ו-${Math.abs(y)} ${y>=0?'למעלה':'למטה'} מהראשית.`}},
()=>{const x=nz(-5,5),y=nz(-5,5);const q=x>0&&y>0?'רביע I':x<0&&y>0?'רביע II':x<0&&y<0?'רביע III':'רביע IV';return{type:'choice',t:`באיזה רביע נמצאת הנקודה ${P(x,y)}?`,pts:[[x,y,'A']],opts:['רביע I','רביע II','רביע III','רביע IV'],ans:q,hint:'רביע I: (+,+) · II: (−,+) · III: (−,−) · IV: (+,−)',why:`x ${x>0?'חיובי':'שלילי'} ו-y ${y>0?'חיובי':'שלילי'} ← ${q}.`}},
()=>{const onX=r(0,1),v=nz(-5,5);const pt=onX?[v,0]:[0,v];return{type:'choice',t:`על איזה ציר נמצאת הנקודה ${P(pt[0],pt[1])}?`,pts:[[pt[0],pt[1],'A']],opts:['ציר x','ציר y'],ans:onX?'ציר x':'ציר y',hint:'בנקודה שעל ציר x שיעור ה-y שווה 0, ובנקודה שעל ציר y שיעור ה-x שווה 0.',why:onX?'y = 0 ← הנקודה על ציר x.':'x = 0 ← הנקודה על ציר y.'}},
()=>{const sx=r(-3,3),sy=r(-3,3),dx=nz(-3,3),dy=nz(-3,3);return{type:'xy',t:`מתחילים בנקודה A ${P(sx,sy)} ומזיזים ${Math.abs(dx)} צעדים ${dx>0?'ימינה':'שמאלה'} ו-${Math.abs(dy)} צעדים ${dy>0?'למעלה':'למטה'}. באיזו נקודה נגיע?`,pts:[[sx,sy,'A']],ans:[sx+dx,sy+dy],hint:'ימינה/שמאלה משנה את x. למעלה/למטה משנה את y.',why:`${P(sx,sy)} ← ${P(sx+dx,sy+dy)}`}}
];

COORD.push(
()=>{const y=nz(-5,5);return{type:'xy',t:'מהם שיעורי הנקודה A?',pts:[[0,y,'A']],ans:[0,y],hint:'הנקודה נמצאת על ציר y, ולכן שיעור ה-x שלה הוא 0. את שיעור ה-y קוראים מהמספר שליד הנקודה.',why:`הנקודה A היא ${P(0,y)} – נקודה על ציר y.`}},
()=>{const y=nz(-5,5);return{type:'click',t:`לחצו על הרשת כדי לסמן את הנקודה ${P(0,y)} (היא נמצאת על ציר y)`,pts:[],ans:[0,y],hint:`נקודה על ציר y נמצאת מעל או מתחת לראשית: זזים ${Math.abs(y)} צעדים ${y>0?'למעלה':'למטה'}, בלי לזוז ימינה או שמאלה.`,why:`${P(0,y)} נמצאת על ציר y, ${Math.abs(y)} צעדים ${y>0?'מעל':'מתחת'} הראשית.`}},
()=>{const y=nz(-9,9);return{type:'xy',t:`נקודה נמצאת על ציר y, ושיעור ה-y שלה הוא ${L(f(y))}. מהם שיעורי הנקודה?`,ans:[0,y],hint:'כל נקודה שעל ציר y נמצאת בדיוק מעל או מתחת לראשית, ולכן שיעור ה-x שלה הוא 0.',why:`שיעורי הנקודה: ${P(0,f(y))}.`}}
);

const ANG=[
()=>{const x=r(10,80);return{type:'num',unit:'°',t:`שתי זוויות משלימות ל-90°. אחת מהן היא ${x}°. מה גודל הזווית השנייה?`,ans:90-x,hint:'סכום שתי זוויות משלימות ל-90° הוא 90°.',why:L(`90 − ${x} = ${90-x}`)+'°'}},
()=>{let x;do x=r(20,160);while(x===90);return{type:'num',unit:'°',t:`שתי זוויות צמודות (משלימות ל-180°). אחת מהן היא ${x}°. מה גודל השנייה?`,ans:180-x,hint:'זוויות צמודות מרכיבות קו ישר: סכומן 180°.',why:L(`180 − ${x} = ${180-x}`)+'°'}},
()=>{const a=r(25,80),b=r(25,80);return{type:'num',unit:'°',t:'מצאו את הזווית החסרה במשולש (הציור אינו בקנה מידה).',svg:asvg(`<polygon class="sh" points="30,150 230,150 120,25"/><text x="46" y="142" font-size="15">${a}°</text><text x="214" y="142" font-size="15" text-anchor="end">${b}°</text><text x="120" y="68" font-size="18" text-anchor="middle" font-weight="700">?</text>`),ans:180-a-b,hint:'סכום הזוויות במשולש הוא 180°.',why:L(`180 − ${a} − ${b} = ${180-a-b}`)+'°'}},
()=>{let a;do a=r(30,150);while(a===90);const th=a*RAD,c=[130,90],k=r(0,1);
 const pos=m=>[130+42*Math.cos(m*RAD),94-42*Math.sin(m*RAD)];
 const m1=pos(a/2),m2=pos((a+180)/2),m3=pos(a/2+180);
 const lab=(p,t,q)=>`<text x="${p[0]}" y="${p[1]}" font-size="${q?19:15}" text-anchor="middle" ${q?'font-weight="700"':''}>${t}</text>`;
 const svg=asvg(`<line class="ln" x1="20" y1="90" x2="240" y2="90"/><line class="ln" x1="${130-85*Math.cos(th)}" y1="${90+85*Math.sin(th)}" x2="${130+85*Math.cos(th)}" y2="${90-85*Math.sin(th)}"/>`+lab(m1,a+'°')+(k?lab(m2,'?',1):lab(m3,'?',1)));
 return{type:'num',unit:'°',t:'שני ישרים נחתכים. מה גודל הזווית המסומנת ב-?',svg,ans:k?180-a:a,hint:k?'הזוויות הצמודות מרכיבות קו ישר: סכומן 180°.':'זוויות קודקודיות (מנוגדות בחיתוך שני ישרים) שוות זו לזו.',why:k?L(`180 − ${a} = ${180-a}`)+'° (זוויות צמודות)':`זוויות קודקודיות שוות, ולכן ${a}°.`}},
()=>{const a=r(50,110),b=r(50,110),c=r(40,100);return{type:'num',unit:'°',t:`ארבע זוויות מקיפות נקודה אחת. שלוש מהן: ${a}°, ${b}°, ${c}°. מה גודל הרביעית?`,ans:360-a-b-c,hint:'סכום הזוויות סביב נקודה הוא 360°.',why:L(`360 − ${a} − ${b} − ${c} = ${360-a-b-c}`)+'°'}},
()=>{const x=pick([r(10,80),90,r(95,170),180]);const k=x<90?'חדה':x===90?'ישרה':x<180?'קהה':'שטוחה';const cx=Math.cos(x*RAD),sy=Math.sin(x*RAD);
 const svg=asvg(`<line class="ln" x1="130" y1="150" x2="230" y2="150"/><line class="ln" x1="130" y1="150" x2="${130+100*cx}" y2="${150-100*sy}"/><path class="ar" d="M 160 150 A 30 30 0 0 0 ${130+30*cx} ${150-30*sy}"/>`);
 return{type:'choice',t:'איזו זווית מופיעה בציור?',svg,opts:['חדה','ישרה','קהה','שטוחה'],ans:k,hint:'חדה: קטנה מ-90° · ישרה: 90° · קהה: בין 90° ל-180° · שטוחה: 180°',why:`זווית ${k}.`}}
];
const pt=(o,d,l)=>[o[0]+l*Math.cos(d*RAD),o[1]-l*Math.sin(d*RAD)];
const arcp=(o,rd,a1,a2)=>{const p=pt(o,a1,rd),q=pt(o,a2,rd);return `<path class="ar" d="M ${p[0]} ${p[1]} A ${rd} ${rd} 0 ${a2-a1>180?1:0} 0 ${q[0]} ${q[1]}"/>`};
const ray=(o,d,l)=>{const p=pt(o,d,l);return `<line class="ln" x1="${o[0]}" y1="${o[1]}" x2="${p[0]}" y2="${p[1]}"/>`};
const tx=(o,d,rd,t,q)=>{const p=pt(o,d,rd);return `<text x="${p[0]}" y="${p[1]+5}" font-size="${q?20:15}" text-anchor="middle"${q?' font-weight="700"':''}>${t}</text>`};
const cross=(th,lb)=>{const O=[130,90],p=pt(O,th,85),q=pt(O,th+180,85);let s=`<line class="ln" x1="20" y1="90" x2="240" y2="90"/><line class="ln" x1="${q[0]}" y1="${q[1]}" x2="${p[0]}" y2="${p[1]}"/>`;[th/2,(th+180)/2,th/2+180,(th+180)/2+180].forEach((m,i)=>{s+=tx(O,m,40,lb[i],lb[i]==='?')});return asvg(s)};
const lets=(O,a,t)=>tx(O,0,153,'A')+tx(O,a,139,'B')+tx(O,t,129,'C')+'<text x="82" y="172" font-size="15">O</text>';
const NOTE='(הציור אינו בקנה מידה)';
ANG[0]=()=>{const x=r(15,75),O=[50,160];return{type:'num',unit:'°',t:`מצאו את גודל הזווית המסומנת ב-? ${NOTE}`,svg:asvg(ray(O,0,170)+ray(O,90,130)+ray(O,x,140)+'<path class="ar" d="M 70 160 L 70 140 L 50 140"/>'+tx(O,x/2,62,x+'°')+tx(O,(x+90)/2,62,'?',1)),ans:90-x,hint:'הריבוע מסמן זווית ישרה (90°). שתי הזוויות שבתוכה משלימות ל-90°.',why:L(`90 − ${x} = ${90-x}`)+'°'}};
ANG[1]=()=>{let x;do x=r(30,150);while(x===90);const O=[130,150];return{type:'num',unit:'°',t:`מצאו את גודל הזווית המסומנת ב-? ${NOTE}`,svg:asvg(ray(O,0,110)+ray(O,180,110)+ray(O,x,120)+tx(O,x/2,50,x+'°')+tx(O,(x+180)/2,50,'?',1)),ans:180-x,hint:'שתי הזוויות מרכיבות קו ישר (זוויות צמודות), ולכן סכומן 180°.',why:L(`180 − ${x} = ${180-x}`)+'°'}};
ANG[4]=()=>{const a=r(50,110),b=r(50,110),c=r(40,100),d=360-a-b-c,O=[130,90];return{type:'num',unit:'°',t:`מצאו את גודל הזווית המסומנת ב-? ${NOTE}`,svg:asvg(ray(O,0,80)+ray(O,a,80)+ray(O,a+b,80)+ray(O,a+b+c,80)+tx(O,a/2,38,a+'°')+tx(O,a+b/2,38,b+'°')+tx(O,a+b+c/2,38,c+'°')+tx(O,a+b+c+d/2,38,'?',1)),ans:d,hint:'סכום הזוויות סביב נקודה הוא 360°.',why:L(`360 − ${a} − ${b} − ${c} = ${d}`)+'°'}};
ANG.push(
()=>{const th=r(40,65),p=pick([[1,3,'קודקודיות'],[2,4,'קודקודיות'],[1,2,'צמודות'],[2,3,'צמודות'],[3,4,'צמודות'],[4,1,'צמודות']]);return{type:'choice',t:`בציור שני ישרים נחתכים. הזוויות ${L(p[0])} ו-${L(p[1])} הן זוויות:`,svg:cross(th,['1','2','3','4']),opts:['קודקודיות','צמודות'],ans:p[2],hint:'קודקודיות: מנוגדות זו לזו. צמודות: חולקות צלע משותפת ומרכיבות קו ישר.',why:p[2]==='קודקודיות'?`הזוויות ${p[0]} ו-${p[1]} מנוגדות, ולכן הן קודקודיות (והן שוות זו לזו).`:`הזוויות ${p[0]} ו-${p[1]} חולקות צלע ומרכיבות קו ישר, ולכן הן צמודות (סכומן 180°).`}},
()=>{const th=r(40,65),k=r(1,4),v=(k+1)%4+1;return{type:'choice',t:`בציור שני ישרים נחתכים. איזו זווית היא קודקודית לזווית ${L(k)}?`,svg:cross(th,['1','2','3','4']),opts:[1,2,3,4].filter(n=>n!==k).map(n=>`זווית ${n}`),ans:`זווית ${v}`,hint:'זווית קודקודית נמצאת מול הזווית, בצד השני של נקודת החיתוך.',why:`זווית ${v} נמצאת מול זווית ${k}, ולכן הן קודקודיות.`}},

 h+='<div class="row" style="margin:14px 0"><button class="btn" id="chk">בדיקת כל התרגילים</button><button class="btn sec" id="rst">תרגילים חדשים</button></div>';
 $('main').innerHTML=h;$('chk').onclick=checkAll;$('rst').onclick=()=>{build();window.scrollTo({top:0,behavior:'smooth'})}}
function checkOne(q,force){if(q.done)return;const root=$('ex'+q.i),ins=[...root.querySelectorAll('input')],rs=root.querySelector('.res');let v=null,good=false;
 const num=s=>{s=s.trim().replace('−','-').replace(',','.');let m=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m)return +m[3]?Number(m[1])+(m[1][0]==='-'?-1:1)*m[2]/m[3]:null;m=s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);if(m)return +m[2]?m[1]/m[2]:null;return s!==''&&!isNaN(Number(s))?Number(s):null};
 if(q.type==='num'){v=num(ins[0].value);good=v!==null&&Math.abs(v-q.ans)<1e-9}
 else if(q.type==='xy'){const a=ins.map(i=>num(i.value));if(a.every(x=>x!==null)){v=a;good=a[0]===q.ans[0]&&a[1]===q.ans[1]}}
 else if(q.type==='click'){v=q.cp||null;good=!!v&&v[0]===q.ans[0]&&v[1]===q.ans[1]}
 else{v=q.sel||null;good=v===q.ans}
 if(v===null&&!force){rs.hidden=false;rs.className='fb res hint';rs.innerHTML='כתבו או בחרו תשובה קודם 🙂';return}
 q.done=true;q.good=good;
 if(q.type==='click')root.querySelector('.sv').innerHTML=grid([[q.ans[0],q.ans[1],'✓']],good?null:v);
 if(q.type==='choice')root.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.remove('sel');const t=q.opts[b.dataset.o];if(t===q.ans)b.classList.add('good');else if(t===v)b.classList.add('wrong')});
 ins.forEach(i=>i.disabled=true);
 rs.hidden=false;rs.className='fb res '+(good?'ok':'no');rs.innerHTML=(good?'✅ ':v===null?'⬜ לא נענה. ':'❌ ')+q.why;
 const cb=root.querySelector('.ck');if(cb)cb.hidden=true}
function refresh(){let ok=0,n=0;const tot={},okc={};
 EX.forEach(q=>{tot[q.si]=(tot[q.si]||0)+1;if(q.done){n++;if(q.good){ok++;okc[q.si]=(okc[q.si]||0)+1}}});
 document.querySelectorAll('h2').forEach(h=>{const s=h.dataset.s;h.textContent=h.dataset.name+(n?` – ${okc[s]||0}/${tot[s]}`:'')});
 if(!n){$('score').innerHTML='';return}
 let m='';if(n===EX.length){const p=ok/n;m=p>=.9?'מצוין! מוכנים למבחן 🌟':p>=.7?'טוב מאוד! עוד קצת תרגול ותהיו מושלמים.':p>=.5?'התחלה טובה. חזרו על התזכורת וצפו בהסברים לטעויות.':'לא נורא – חזרו על התזכורת ונסו תרגילים חדשים.'}
 $('score').innerHTML=`<div class="card"><div class="big">${ok}/${n}</div><p style="text-align:center;margin:0">${m||`נבדקו ${n} מתוך ${EX.length} תרגילים`}</p></div>`}
function checkAll(){EX.forEach(q=>checkOne(q,true));refresh();$('chk').disabled=true;window.scrollTo({top:0,behavior:'smooth'})}
$('main').addEventListener('click',e=>{
 const hb=e.target.closest('.hb');if(hb){const h=hb.nextElementSibling;h.innerHTML='💡 '+EX[hb.dataset.i].hint;h.hidden=!h.hidden;return}
 const kb=e.target.closest('.ck');if(kb){checkOne(EX[kb.dataset.i]);refresh();return}
 const ob=e.target.closest('.opt');if(ob){const q=EX[ob.dataset.i];if(q.done)return;q.sel=q.opts[ob.dataset.o];ob.parentNode.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));ob.classList.add('sel');return}
 const sv=e.target.closest('.sv');if(!sv)return;const q=EX[sv.dataset.i];if(q.type!=='click'||q.done)return;
 const g=sv.querySelector('svg'),R=g.getBoundingClientRect(),k=264/R.width,cl=v=>Math.max(-5,Math.min(5,v));
 q.cp=[cl(Math.round(((e.clientX-R.left)*k-132)/24)),cl(-Math.round(((e.clientY-R.top)*k-132)/24))];sv.innerHTML=grid([],q.cp)});
$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){checkOne(EX[e.target.dataset.i]);refresh()}});
tabs();build();
</script>
</body>
</html>
